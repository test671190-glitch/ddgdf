<script type="importmap">
  { "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
  // Background scene: an opaque, slowly flowing colour field (a shader on a plane fixed to the
  // camera) with refracting glass shapes in front of it. The colour field is opaque on purpose:
  // three.js transmission only refracts opaque geometry, so the glass now bends real colour.
  import * as THREE from "three";
  import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

  const canvas = document.getElementById("scene");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)");
  const lite = matchMedia("(max-width: 760px), (pointer: coarse)").matches;
  const BG_DISTANCE = 40;

  function init() {
    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ canvas, antialias: !lite, alpha: false, powerPreference: "high-performance" });
    } catch (e) {
      canvas.remove();
      return;
    }
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, lite ? 1 : 1.25));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    if ("transmissionResolutionScale" in renderer) renderer.transmissionResolutionScale = lite ? 0.35 : 0.5;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
    camera.position.set(0, 0, 16);
    scene.add(camera);
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

    // ---- flowing colour field ----
    const cs = getComputedStyle(document.documentElement);
    const css = (name, fallback) => new THREE.Color(cs.getPropertyValue(name).trim() || fallback);
    const bgUniforms = {
      uTime: { value: 0 },
      uScroll: { value: 0 },
      uAspect: { value: 1 },
      uBase: { value: css("--bg", "#06070a") },
      uA: { value: css("--glow-a", "#ff6a2b") },
      uB: { value: css("--glow-b", "#1fb8cc") },
      uC: { value: css("--glow-c", "#f2b632") },
    };
    const bg = new THREE.Mesh(
      new THREE.PlaneGeometry(1, 1),
      new THREE.ShaderMaterial({
        uniforms: bgUniforms,
        depthWrite: false,
        vertexShader: /* glsl */ `
          varying vec2 vUv;
          void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
        `,
        fragmentShader: /* glsl */ `
          uniform float uTime, uScroll, uAspect;
          uniform vec3 uBase, uA, uB, uC;
          varying vec2 vUv;
          float blob(vec2 p, vec2 c, float r) { vec2 d = p - c; return exp(-dot(d, d) / (r * r)); }
          void main() {
            vec2 p = vec2(vUv.x * uAspect, vUv.y);
            float t = uTime;
            float s = uScroll;
            vec2 a = vec2(uAspect * (0.12 + 0.06 * sin(t * 0.13)), 0.86 + 0.05 * cos(t * 0.11) - s * 0.55);
            vec2 b = vec2(uAspect * (0.88 + 0.05 * cos(t * 0.09)), 0.42 + 0.07 * sin(t * 0.12) + s * 0.25);
            vec2 c = vec2(uAspect * (0.45 + 0.08 * sin(t * 0.07 + 1.3)), -0.05 + 0.06 * cos(t * 0.1) + s * 0.9);
            vec3 col = uBase;
            col += uA * blob(p, a, 0.36) * 0.5;
            col += uB * blob(p, b, 0.4) * 0.45;
            col += uC * blob(p, c, 0.3) * 0.32;
            // fine film grain against banding
            float n = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453);
            col += (n - 0.5) * 0.012;
            gl_FragColor = vec4(col, 1.0);
            #include <colorspace_fragment>
          }
        `,
      })
    );
    bg.position.z = -BG_DISTANCE;
    bg.renderOrder = -1;
    camera.add(bg);

    // ---- glass ----
    const glass = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      metalness: 0,
      roughness: 0.04,
      transmission: 1,
      thickness: 1.8,
      ior: 1.48,
      iridescence: 0.55,
      iridescenceIOR: 1.3,
      clearcoat: 1,
      clearcoatRoughness: 0.05,
      envMapIntensity: 1.25,
      attenuationColor: new THREE.Color(0xcfe6ff),
      attenuationDistance: 3,
      specularIntensity: 1,
    });

    const knot = new THREE.Mesh(new THREE.TorusKnotGeometry(1.35, 0.46, lite ? 160 : 280, lite ? 24 : 40), glass);
    scene.add(knot);
    const shapes = [];
    const geos = [
      new THREE.IcosahedronGeometry(0.85, lite ? 4 : 6),
      new THREE.TorusGeometry(0.72, 0.27, 32, lite ? 64 : 120),
      new THREE.CapsuleGeometry(0.4, 0.85, 12, 32),
      new THREE.OctahedronGeometry(0.85, 0),
    ];
    // spread down the page; x kept to the outer margins so shapes sit beside the content column
    const layout = lite
      ? [[-1.7, -7, -3], [1.9, -14, -3], [-1.6, -22, -3]]
      : [[-6.4, -6, -3], [6.6, -11, -2], [-6.2, -17, -3.5], [6.4, -23, -2.5], [-6.6, -29, -3], [6.2, -35, -3.5]];
    layout.forEach(([x, y, z], i) => {
      const mesh = new THREE.Mesh(geos[i % geos.length], glass);
      mesh.position.set(x, y, z);
      mesh.userData = { x, y, spin: 0.12 + (i % 3) * 0.05, phase: i * 1.7 };
      scene.add(mesh);
      shapes.push(mesh);
    });

    const key = new THREE.DirectionalLight(0xffffff, 1.6);
    key.position.set(3, 5, 6);
    scene.add(key);
    const rim = new THREE.DirectionalLight(0xffb48a, 0.8);
    rim.position.set(-5, -2, 3);
    scene.add(rim);

    // ---- layout ----
    function visibleHalf() {
      const halfH = BG_DISTANCE * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
      return { halfH, halfW: halfH * camera.aspect };
    }
    function layoutHero() {
      // the knot lives at z≈0, 16 units from the camera
      const halfH = 16 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
      const halfW = halfH * camera.aspect;
      if (innerWidth <= 600) {
        knot.position.set(halfW * 0.35, -halfH * 1.25, -1);
        knot.scale.setScalar(0.62);
      } else {
        knot.position.set(halfW * 0.64, halfH * 0.08, 0);
        knot.scale.setScalar(Math.max(0.55, Math.min(1, halfW / 9.5)));
      }
      const spread = Math.min(1, halfW / 9);
      shapes.forEach((m) => { m.userData.xs = m.userData.x * spread; });
    }
    function resize() {
      renderer.setSize(innerWidth, innerHeight, false);
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      const { halfH, halfW } = visibleHalf();
      bg.scale.set(halfW * 2.3, halfH * 2.3, 1);
      bgUniforms.uAspect.value = camera.aspect;
      layoutHero();
    }
    resize();
    addEventListener("resize", resize);

    const pointer = { x: 0, y: 0, tx: 0, ty: 0 };
    addEventListener("pointermove", (e) => {
      pointer.tx = (e.clientX / innerWidth) * 2 - 1;
      pointer.ty = (e.clientY / innerHeight) * 2 - 1;
    }, { passive: true });

    // frame-rate independent smoothing
    const ease = (rate, dt) => 1 - Math.exp(-rate * dt);
    let t = 0, camY = 0, scrollF = 0;
    function update(dt) {
      t += dt;
      const maxScroll = Math.max(1, document.documentElement.scrollHeight - innerHeight);
      const f = Math.min(1, Math.max(0, scrollY / maxScroll));
      scrollF += (f - scrollF) * ease(6, dt);
      camY = -scrollF * 38;
      pointer.x += (pointer.tx - pointer.x) * ease(3, dt);
      pointer.y += (pointer.ty - pointer.y) * ease(3, dt);
      camera.position.set(pointer.x * 0.5, camY - pointer.y * 0.35, 16);
      camera.lookAt(pointer.x * 0.15, camY, 0);

      bgUniforms.uTime.value = t;
      bgUniforms.uScroll.value = scrollF;

      knot.rotation.x = t * 0.16 + pointer.y * 0.2;
      knot.rotation.y = t * 0.22 + pointer.x * 0.3;
      shapes.forEach((m) => {
        const u = m.userData;
        m.rotation.x = t * u.spin + u.phase;
        m.rotation.y = t * u.spin * 1.25;
        m.position.x = u.xs ?? u.x;
        m.position.y = u.y + Math.sin(t * 0.5 + u.phase) * 0.3;
      });
    }

    if (reduce.matches) {
      update(0);
      renderer.render(scene, camera);
      addEventListener("resize", () => { update(0); renderer.render(scene, camera); });
      return;
    }

    // Render on every display frame (no fixed cap: a cap that does not divide the refresh rate
    // causes uneven frame pacing, which reads as stutter). Phones render every other frame.
    let last = 0, frame = 0, running = true;
    document.addEventListener("visibilitychange", () => { running = !document.hidden; last = 0; });
    renderer.setAnimationLoop((now) => {
      if (!running) return;
      const dt = last ? Math.min((now - last) / 1000, 0.1) : 1 / 60;
      last = now;
      frame++;
      update(dt);
      if (lite && frame % 2) return;
      renderer.render(scene, camera);
    });
  }

  // Phones get the CSS glow only: the glass scene (a transmission pass every frame) under
  // blurred cards overloaded mobile GPUs — stutter, flicker and lost WebGL contexts
  if (lite) {
    canvas.remove();
  } else {
    // a lost context (GPU reset, driver crash) left a frozen or black canvas over the glow
    canvas.addEventListener("webglcontextlost", () => canvas.remove());
    try { init(); } catch (e) { console.warn("3D background disabled:", e); canvas.remove(); }
  }
</script>
